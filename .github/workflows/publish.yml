name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # Manual runs (Actions tab or API); publishes whatever versions package.json holds
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Publishes ai-memory-skill and the kiro-memory-skill forwarder (old name).
      # Versions already on npm are skipped, so a tag can be re-run safely.
      - name: Publish packages
        run: |
          for dir in . legacy/kiro-memory-skill; do
            spec=$(node -p "const p=require('./$dir/package.json'); p.name+'@'+p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec already published, skipping"
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done
